<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <title>Bpost TS Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
  </head>


  <body>
    <main class=".container-fluid p-2">
        <h1 class="display-4">Daily Checklist</h1>

        <section id="daily-checklist">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkMails">
                <label class="form-check-label" for="checkMails">Mails behandelen</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkKlara">
                <label class="form-check-label" for="checkKlara">Klara klachten</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkSumo">
                <label class="form-check-label" for="checkSumo">Sumo klachten</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkWorkPostsMorning">
                <label class="form-check-label" for="checkWorkPostsMorning">Werkpost controle van 10:30</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkWorkPostsMidday">
                <label class="form-check-label" for="checkWorkPostsMidday">Werkpost controle van 14:30</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkZZA">
                <label class="form-check-label" for="checkZZA">ZZA controle</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkDistri">
                <label class="form-check-label" for="checkDistri">Uitreikingen in Distri</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkZZANextWeek">
                <label class="form-check-label" for="checkZZANextWeek">Planning ZZA volgende week</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkDaily">
                <label class="form-check-label" for="checkDaily">Daily Quality Check</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="CheckQuality">
                <label class="form-check-label" for="CheckQuality">Kwaliteit invullen</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="CheckDMM">
                <label class="form-check-label" for="CheckDMM">DMM controleren</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="CheckPlanning">
                <label class="form-check-label" for="CheckPlanning">Planning voorbereiden</label>
            </div>

            <button type="button" id="btnReset" class="btn btn-primary my-2 px-4">Reset</button>
        </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
